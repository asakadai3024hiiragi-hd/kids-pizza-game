<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ピザ職人チャレンジ</title>
<script>
// 古いサイト(GitHub)→新しいサイト(Netlify)への転送用ページ。
// この端末に古いサイトで取ったクーポン番号・10時間制限の時刻が残っていれば、
// アドレスの「#from-old=...」(#より後ろはサーバーに送られない)に入れて新しいサイトへ渡す。
// 店舗名(?store=...)はそのまま引き継ぐ。古い記録は消さない(何度開いても同じように渡す)。
(function () {
  var NEW_URL = 'https://pizza-chef-kids.netlify.app/';
  var hash = '';
  try {
    var codes = JSON.parse(localStorage.getItem('kg_my_coupons') || '[]');
    if (!Array.isArray(codes)) codes = [];
    var list = [];
    for (var i = 0; i < codes.length; i++) {
      if (typeof codes[i] === 'string' && codes[i]) list.push(codes[i]);
    }
    var t = Number(localStorage.getItem('kg_coupon_claimed_at') || 0) || 0;
    if (list.length || t > 0) {
      hash = '#from-old=' + encodeURIComponent(JSON.stringify({ c: list.slice(-100), t: t }));
    }
  } catch (e) { /* 記録が読めなくても転送はする */ }
  location.replace(NEW_URL + location.search + hash);
})();
</script>
<noscript><meta http-equiv="refresh" content="0; url=https://pizza-chef-kids.netlify.app/"></noscript>
</head>
<body style="font-family:sans-serif;text-align:center;padding:40px 16px;">
<p>ピザ職人チャレンジは新しいページに引っ越しました。移動しています…</p>
<p><a href="https://pizza-chef-kids.netlify.app/">移動しない場合はこちら</a></p>
</body>
</html>
